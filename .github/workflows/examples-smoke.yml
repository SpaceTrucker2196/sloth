name: examples-smoke

# End-to-end smoke test for the JSONL stream pipeline:
#   mock-sloth → sloth-forward (loki sink) → in-process fake Loki
#
# Catches drift between sloth's wire format, the forwarder's sink
# implementations, and the Compose demo's synthetic producer. Runs
# in <10s; no Docker dependency (the actual Compose stack lives in
# examples/compose/docker-compose.yml and isn't exercised here).

on:
  push:
    paths:
      - "examples/**"
      - ".github/workflows/examples-smoke.yml"
  pull_request:
    paths:
      - "examples/**"
      - ".github/workflows/examples-smoke.yml"

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run smoke test
        run: python3 examples/compose/smoke_test.py
