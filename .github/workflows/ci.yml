name: CI

on:
  push:
  pull_request:

# agents/AGENTS.md requires every advertised build configuration to be
# warning-clean. Two things made that a promise rather than a fact:
#
#   1. CI built four of the six configurations. WITH_PCAP=0 and WITH_WIFI=0
#      were verified only by whoever remembered to run them locally. That is
#      how #99 reached main and sat there — two unused statics in
#      src/views/wifi.c that only WITH_WIFI=0 ever compiled.
#   2. Nothing here failed on a warning. Every step below checked that the
#      code *compiles*, which is a weaker claim than the one the contract
#      makes. EXTRA_CFLAGS=-Werror closes that; it is appended to CFLAGS in
#      the Makefile rather than replacing it, because CFLAGS uses ?= and
#      overriding it wholesale would silently drop -Wall -Wextra -std=c99.
env:
  EXTRA_CFLAGS: -Werror

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0

      - name: Install dependencies
        run: sudo apt-get install -y libncurses-dev libpcap-dev libsqlite3-dev

      - name: Build
        run: make

      - name: Test
        run: make test

      # The capture path is not in `make test`: sloth_test is built
      # without WITH_PCAP, so on_packet() and every parser it reaches
      # were untested and unsanitised until #95 added this binary.
      - name: Test the capture path (real pcap_dispatch)
        run: make test-capture-path

      # The advertised build configurations are only real if something
      # builds them. #48 shipped a WITH_NCURSES=0 break that survived
      # because CI only ever built the default config. A unit test can't
      # catch "this translation unit doesn't compile" — this is the
      # inspection step for it.
      - name: Build without ncurses
        run: make clean && make WITH_NCURSES=0

      # Capture is optional; the packets and probe views render a disabled
      # message without it.
      - name: Build without pcap
        run: make clean && make WITH_PCAP=0

      # Drops the nl80211 source. #99 lived here: the wifi view's helpers
      # sat outside the guard that removes their only callers.
      - name: Build without wifi
        run: make clean && make WITH_WIFI=0

      - name: Build embedded (no ncurses, no pcap, no sqlite)
        run: make clean && make embedded

      # The sink is optional; a build without it must stay clean too,
      # since the embedded target is not the only WITH_SQLITE=0 config.
      - name: Build without sqlite
        run: make clean && make WITH_SQLITE=0

  # The full suite under AddressSanitizer + UndefinedBehaviorSanitizer
  # (#95). The parsers read off-the-air and off-the-wire bytes; a unit
  # test that passes while reading past its buffer is a false green.
  # #83 (EAPOL-Key over-read) was only CONFIRMED by a manual ASan run —
  # this makes that run the default for every push.
  #
  # Blocking by design: -fno-sanitize-recover=all turns every UBSan
  # report into an abort, and no step here is continue-on-error. It
  # landed only after the suite was green under exactly these flags.
  #
  # Leak detection is on with no suppression file: the suite has zero
  # leaks today, so there is nothing to suppress. If a third-party
  # static allocation (e.g. libsqlite3) ever needs one, it goes in
  # tests/lsan.supp with a reason per entry, and never an allocation
  # made by sloth's own code.
  #
  # Flags ride on EXTRA_CFLAGS, which the Makefile appends to both
  # CFLAGS and TEST_CFLAGS — the test link line reuses TEST_CFLAGS, so
  # the sanitizer runtime is linked without touching the Makefile.
  sanitize:
    runs-on: ubuntu-24.04
    env:
      EXTRA_CFLAGS: -Werror -fsanitize=address,undefined -fno-omit-frame-pointer -fno-sanitize-recover=all
      ASAN_OPTIONS: detect_leaks=1:detect_stack_use_after_return=1:strict_string_checks=1
      UBSAN_OPTIONS: print_stacktrace=1:halt_on_error=1
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0

      - name: Install dependencies
        run: sudo apt-get install -y libncurses-dev libpcap-dev libsqlite3-dev

      - name: Test under ASan + UBSan
        run: make test

      # The point of #95's "through the real pcap_dispatch callback
      # path, not only seeded state": this is the one job where ASan and
      # UBSan see frames arriving the way an attacker sends them —
      # truncated at every offset, lying about their own lengths — via
      # libpcap's own reader rather than a seeded struct.
      - name: Test the capture path under ASan + UBSan
        run: make test-capture-path

      # The shipped binary, not only the suite (#95). Until the link rule
      # was fixed this step could not have existed: `$(TARGET)` linked with
      # `$(CC) -o $@ $^ $(LDFLAGS)`, no compiler flags, so every object
      # compiled instrumented and ld then failed on __asan_init /
      # __asan_report_*. The consequence is what makes this a gap and not a
      # curiosity — `src/main.c`, the libpcap capture path and the ncurses
      # renderer live only in `sloth`, never in `sloth_test`, so the step
      # above has never covered a line of them. Linking was the whole
      # assertion until #119: MISSION.md §2 forbids running sloth against
      # an interface, and CI has none. The replay step after these two
      # executes it anyway, on generated savefiles instead of an interface.
      #
      # `embedded` too, because it reaches the same rule through a
      # sub-make — the path by which a $(MAKE) recursion could drop flags.
      #
      # -Werror is dropped for this step alone (the job-level EXTRA_CFLAGS
      # is replaced, not extended). Three gcc diagnostics fire only under
      # ASan instrumentation, which perturbs inlining and value-range
      # propagation enough that gcc loses the bounds it otherwise proves:
      #   - -Wstringop-truncation, src/dns_snoop.c:122 and :134 — strncpy
      #     of sizeof-1 followed by an explicit NUL on the next line
      #   - -Warray-bounds, memcpy inlined into deauth_parse at
      #     src/deauth_snoop.c:57 — "bounds [0, 0]" for a uint8_t[6] field,
      #     behind a len >= 24 guard
      #   - -Wstringop-overread, the a->enc strcmp at src/wifi_assess.c:112
      # All three are diagnostic artifacts of the instrumentation, not link
      # failures, and none appears in any of the six advertised
      # configurations — every one of those stays -Werror clean in the
      # `test` job. Making them red here would fail this step for something
      # it does not assert. Whether they are worth silencing at the source
      # is a separate question and a separate slice.
      - name: Build sloth under ASan + UBSan (link check)
        env:
          EXTRA_CFLAGS: -fsanitize=address,undefined -fno-omit-frame-pointer
        run: make clean && make

      - name: Build embedded under ASan + UBSan (link check)
        env:
          EXTRA_CFLAGS: -fsanitize=address,undefined -fno-omit-frame-pointer
        run: make clean && make embedded

      # The shipped binary, executed (#119): `sloth --replay` over the
      # generated savefiles, diffed against tests/replay/golden.jsonl,
      # with main(), the poll loop and every sink instrumented. Same
      # flags as the link check plus -fno-sanitize-recover=all, so a UBSan
      # report aborts the run; the job's ASAN_OPTIONS keep leak detection
      # on, which makes sloth's shutdown path part of what is checked.
      # -Werror is dropped for the reason given on the link check above.
      - name: Replay under ASan + UBSan
        env:
          EXTRA_CFLAGS: -fsanitize=address,undefined -fno-omit-frame-pointer -fno-sanitize-recover=all
        run: make clean && make replay-check REPLAY_DIR="$RUNNER_TEMP/replay"

  # Headless replay integration (#119, owner approved 2026-10-15). The one
  # job that runs the shipped `sloth`: --replay feeds it two savefiles that
  # tests/replay/gen_replay.c builds at run time from tests/frame_build.h
  # byte arrays (no capture is committed — AGENTS.md "No pcap fixtures"),
  # --ticks 3 ends the run, and tests/replay/normalise.sh strips what
  # varies per run and per host before the diff against the committed
  # tests/replay/golden.jsonl. A change in what sloth reports is therefore
  # a red job here and a reviewable golden diff in the PR that intends it
  # (`make replay-golden`). Built with the workflow's -Werror.
  replay:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0

      - name: Install dependencies
        run: sudo apt-get install -y libncurses-dev libpcap-dev libsqlite3-dev

      - name: Replay generated savefiles against the golden
        run: make replay-check REPLAY_DIR="$RUNNER_TEMP/replay"

  # ThreadSanitizer (#95). The evil-twin taint table (#95/6730997), the
  # RF-quality counters (#95/21d3c52) and the DNS caller-owned buffer
  # (#95/d28d19b) each shipped a concurrency test that only fails *by
  # chance* without TSan instrumentation — every one of those PRs said so
  # explicitly. This job is what turns "fails by chance" into "fails
  # every run": a real leaf-lock removed from rf_quality.c was confirmed
  # to turn this exact job red (data race at rf_quality.c:28, the
  # unlocked g_n) before this job existed, then reverted.
  #
  # A separate job, not a step added to `sanitize`: TSan and ASan share
  # instrumentation of the same memory operations and are not composable
  # in one binary (a TSan+ASan build is a runtime error, not merely slow).
  #
  # Blocking by design, same as `sanitize`: -fno-sanitize-recover=all plus
  # no continue-on-error. halt_on_error=1 stops at the first race instead
  # of the report ballooning across every worker thread hitting the same
  # unlocked memory.
  tsan:
    runs-on: ubuntu-24.04
    env:
      EXTRA_CFLAGS: -Werror -fsanitize=thread -fno-omit-frame-pointer -fno-sanitize-recover=all
      TSAN_OPTIONS: halt_on_error=1
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0

      - name: Install dependencies
        run: sudo apt-get install -y libncurses-dev libpcap-dev libsqlite3-dev

      - name: Test under ThreadSanitizer
        run: make test

      - name: Test the capture path under ThreadSanitizer
        run: make test-capture-path

  # Static analysis (#95): cppcheck over everything the default build and
  # the research tools compile. Fails on any finding not listed, with its
  # reason, in tests/cppcheck.supp — and on any entry there that no longer
  # matches, because --enable=information reports unmatchedSuppression.
  # The first pass found a real bug the suite had missed (alert detail
  # printed last_seen as "First seen"); it was fixed, not listed.
  #
  # Pinned to ubuntu-24.04 and cppcheck 2.13.0: each cppcheck release
  # adds and retires checks, and a runner-image bump must not turn this
  # job red (or silently green) on code nobody touched. The version guard
  # fails loudly instead, so moving versions is a reviewed change to this
  # job and the suppression list together.
  #
  # The -D set mirrors the default Linux build (`make`), so cppcheck
  # checks that one configuration rather than every #ifdef permutation;
  # the non-Linux platform backends are excluded for the same reason.
  # Warning, portability and performance classes plus errors; style is
  # left off — it is taste, not defects.
  cppcheck:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0

      - name: Install cppcheck
        run: sudo apt-get update && sudo apt-get install -y cppcheck

      # One command, one place: `make cppcheck` carries the version guard,
      # the flags and the scan list (#119). Before this, the same command
      # lived here and in the Makefile, pinned together by a test; the
      # duplicate is gone instead of policed.
      - name: cppcheck
        run: make cppcheck

  # libFuzzer smoke check (#95). Named open on this issue's very first
  # triage comment (2026-09-22) and never picked up through every
  # subsequent wave. `sanitize`/`tsan` above prove specific hand-built
  # cases under gcc; this job searches for a case nobody wrote, under
  # clang, which is the only compiler here with a libFuzzer runtime.
  #
  # Bounded and blocking, not a campaign: no corpus is kept in the repo
  # (AGENTS.md's no-fixtures rule applies to a saved corpus too — it is a
  # captured input by another name), there is no crash-triage process,
  # and FUZZ_SECONDS caps the run so a hang reads as a CI timeout rather
  # than this job growing without bound. `make fuzz` is the single
  # source of truth for how a target is built and run; this step does
  # not duplicate that command.
  #
  # Targets: every tests/fuzz/fuzz_*.c, discovered by the Makefile (#115,
  # #125) - ten as of 2026-10-15, including fuzz_decode_frame, the one
  # WITH_PCAP harness. No list is kept here, so this comment cannot go
  # stale the way the old "four targets" list did.
  #
  # The last two close what this comment used to call a follow-up, and
  # they do it at a different seam than the one that was abandoned.
  # Reaching the IE walk and the radiotap decode through the real
  # pcap_dispatch savefile path was tried and dropped because libpcap's
  # offline-read buffer carries slack well past any one record's caplen
  # (a 10-byte frame still reports malloc_usable_size 2048 at the record
  # pointer), so ASan has no redzone where the frame ends and a modest
  # overread reads as a pass. Calling the two parsers directly takes
  # libpcap out of the path: the fuzzer's own redzoned buffer is what
  # each one reads, which is the property that was missing. See the
  # Makefile comment above the `fuzz` target for the full reasoning.
  #
  # Cost of those two: both are pure parsers linking a few objects, so
  # they add roughly a compile apiece plus 2*FUZZ_SECONDS. The bound
  # still comes from FUZZ_SECONDS, not from the target count, but that
  # is a per-target bound — adding targets grows this job linearly, so a
  # fifth one is a question about the job's budget and not a free move.
  fuzz:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0

      - name: Install clang and its compiler-rt (libFuzzer/ASan/UBSan runtimes)
        run: |
          sudo apt-get update
          sudo apt-get install -y clang
          ver="$(clang -dumpversion | cut -d. -f1)"
          sudo apt-get install -y "libclang-rt-${ver}-dev"
          # libpcap-dev so the WITH_PCAP harness (fuzz_decode_frame, #125)
          # builds here; FUZZ_PCAP=1 below makes its absence a failure
          # rather than the visible SKIP the Makefile allows locally.
          sudo apt-get install -y libpcap-dev

      - name: Fuzz smoke
        run: make fuzz FUZZ_CC=clang FUZZ_SECONDS=30 FUZZ_PCAP=1

  # Hardened build flags (#95, the wave-6 item the original 2026-09-22
  # triage on that issue named and every slice since deferred). The
  # Makefile now always compiles the shipped `sloth`/`embedded` binaries
  # with -fPIE/-fstack-protector-strong/-D_FORTIFY_SOURCE=3, and links
  # them with -pie -Wl,-z,relro,-z,now on Linux.
  #
  # Both halves below matter for a reason specific to this runner image.
  # ubuntu-latest's gcc already defaults to PIE, full RELRO, SSP and
  # FORTIFY=3 on its own — verified while writing this job: deleting the
  # whole Makefile block still yields a binary with every property the
  # "Verify the binary" step checks. So that step alone would stay green
  # even if the Makefile flags were reverted; it is a real sanity check
  # (it would catch e.g. an LDFLAGS rewrite that drops -pie some other
  # way) but it cannot prove *this change* did anything on *this* runner.
  # "Verify the build recipe" is what does that: it greps the actual
  # compile/link command lines gcc printed, so it goes red the moment the
  # Makefile block is removed, host defaults notwithstanding — the real
  # regression guard, proven red against a throwaway revert of the block
  # before this job was written.
  #
  # `sloth_test` is deliberately NOT checked: it is a -O0 -g development
  # binary the operator never runs, and _FORTIFY_SOURCE needs -O1+ to do
  # anything at runtime — this job only asserts what the Makefile change
  # actually claims to cover.
  harden:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0

      - name: Install dependencies
        run: sudo apt-get install -y libncurses-dev libpcap-dev libsqlite3-dev

      - name: Build (capturing the exact compile/link commands)
        run: make clean && make 2>&1 | tee build.log

      - name: Verify the build recipe requests hardening
        run: |
          set -e
          fail=0

          grep -Eq -- '-fPIE\b' build.log || {
            echo "FAIL: no -fPIE in any compile command" >&2; fail=1;
          }
          grep -Eq -- '-fstack-protector-strong\b' build.log || {
            echo "FAIL: no -fstack-protector-strong in any compile command" >&2; fail=1;
          }
          grep -Eq -- '-D_FORTIFY_SOURCE=3\b' build.log || {
            echo "FAIL: no -D_FORTIFY_SOURCE=3 in any compile command" >&2; fail=1;
          }
          grep -E -- '-o sloth ' build.log | grep -q -- '-pie\b' || {
            echo "FAIL: the sloth link command has no -pie" >&2; fail=1;
          }
          grep -E -- '-o sloth ' build.log | grep -Eq -- '-Wl,-z,relro,-z,now\b' || {
            echo "FAIL: the sloth link command has no -Wl,-z,relro,-z,now" >&2; fail=1;
          }

          exit "$fail"

      - name: Verify the binary (defense-in-depth sanity check)
        run: |
          set -e
          fail=0

          readelf -h sloth | grep -q 'Type:.*DYN' || {
            echo "FAIL: sloth is not a Position-Independent Executable (readelf -h Type != DYN)" >&2
            fail=1
          }

          readelf -l sloth | grep -q GNU_RELRO || {
            echo "FAIL: sloth has no GNU_RELRO program header" >&2
            fail=1
          }

          readelf -d sloth | grep -q BIND_NOW || {
            echo "FAIL: sloth is not eagerly bound (no BIND_NOW dynamic flag) - RELRO is partial, not full" >&2
            fail=1
          }

          nm -D sloth | grep -q '__stack_chk_fail' || {
            echo "FAIL: sloth has no __stack_chk_fail reference - stack protector missing" >&2
            fail=1
          }

          nm -D sloth | grep -q '_chk@' || {
            echo "FAIL: sloth calls no fortified (_chk) libc symbol - _FORTIFY_SOURCE not in effect" >&2
            fail=1
          }

          exit "$fail"

      # #100, closed won't-do 2026-10-19: the data socket carries no
      # encryption by owner decision (docs/wiki/data-socket-exposure.md),
      # so no TLS library may ever be linked. A NEEDED entry for one is
      # the failure; tunnelling (ssh -L, stunnel, examples/forwarder)
      # stays the answer for remote consumers.
      - name: Verify no TLS library is linked (default and embedded)
        run: |
          set -e
          fail=0
          tls='lib(ssl|crypto|mbedtls|mbedx509|mbedcrypto|gnutls|wolfssl|nss3|bearssl)[.-]'
          # ldd, not readelf NEEDED: a TLS library pulled in through
          # another dependency (libcurl-style) is linked all the same.
          check() {
            if ldd sloth | grep -Eq "$tls"; then
              echo "FAIL: $1 build links a TLS library:" >&2
              ldd sloth | grep -E "$tls" >&2
              fail=1
            fi
          }
          check default
          make clean && make embedded
          check embedded
          exit "$fail"

  # Software bill of materials (#142, owner approved 2026-10-15). Syft via
  # anchore/sbom-action, CycloneDX JSON, kept as a build artifact. The
  # in-tree `make sbom` is the fallback for hosts without CI; it names
  # the five link dependencies from pkg-config. Pinned by full digest
  # like every other action (tests/test_ci_pins.c).
  sbom:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
      - name: SBOM (CycloneDX)
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c  # v0.24.3
        with:
          path: .
          format: cyclonedx-json
          artifact-name: sloth-sbom.cdx.json

