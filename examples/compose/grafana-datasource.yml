# Auto-provision Loki as Grafana's default datasource so the user
# can open the Explore view and run {job="sloth"} without manual setup.

apiVersion: 1

datasources:
  - name: Loki
    type: loki
    access: proxy
    url: http://loki:3100
    isDefault: true
    editable: true
    jsonData:
      timeout: 60
      maxLines: 5000
