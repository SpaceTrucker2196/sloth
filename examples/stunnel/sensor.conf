; stunnel — SENSOR side (the host running sloth).
;
; Terminates TLS on a routable port and hands the plaintext to sloth's
; LOOPBACK data socket. sloth itself never binds a routable address, so
; --data-socket-allow-remote is NOT needed and must not be used.
;
; Start sloth like this:
;     sloth --headless --data-socket            # tcp:127.0.0.1:8765
; or, better, over a UNIX socket (see the README).
;
;     stunnel /etc/stunnel/sensor.conf
;
; Read examples/stunnel/README.md before deploying. The one mistake
; that silently exposes the plaintext side is swapping accept/connect.

; --- process -------------------------------------------------------
; Drop privileges: stunnel needs none of them to move bytes.
setuid  = stunnel4
setgid  = stunnel4
pid     = /run/stunnel/sloth-sensor.pid

; foreground = yes + output to stderr when run under systemd.
output  = /var/log/stunnel/sloth-sensor.log

; --- service -------------------------------------------------------
[sloth-data]
; TLS side. Bind the specific address you mean, NOT 0.0.0.0 — the same
; reasoning as sloth's own guard: the wildcard binds every interface.
; Replace with this host's real address.
accept  = 192.168.1.50:8766

; Plaintext side: sloth's loopback data socket. Never leaves the host.
connect = 127.0.0.1:8765

; This end is the TLS server.
client  = no

; Server identity. Generate with:
;   openssl req -x509 -newkey rsa:4096 -days 825 -nodes \
;       -keyout sensor-key.pem -out sensor-cert.pem \
;       -subj "/CN=sloth-sensor-01"
cert    = /etc/stunnel/certs/sensor-cert.pem
key     = /etc/stunnel/certs/sensor-key.pem

; --- client authentication (do not skip) ---------------------------
; level 2 = the peer MUST present a certificate that verifies against
; CAfile. Without this, TLS gives you privacy from a passive listener
; and nothing at all against an active one: any host that can reach
; port 8766 completes the handshake and reads the whole stream. For
; this data that is the threat that matters, so mutual TLS is the
; baseline here rather than an enhancement.
verify  = 2
CAfile  = /etc/stunnel/certs/reader-ca.pem

; Modern TLS only.
sslVersion         = TLSv1.3
options            = NO_SSLv2
options            = NO_SSLv3
options            = NO_TLSv1
options            = NO_TLSv1.1
options            = NO_TLSv1.2

; Renegotiation is not needed for a one-way stream; turning it off
; removes a class of DoS against the sensor.
renegotiation      = no
