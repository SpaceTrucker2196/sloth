; stunnel — READER side (the management host / SIEM).
;
; Accepts on LOOPBACK and connects out to the sensor over TLS. Your
; consumer then reads 127.0.0.1:8765 as if sloth were running locally:
;
;     stunnel /etc/stunnel/reader.conf
;     nc 127.0.0.1 8765 | jq -c 'select(.type == "alert")'
;     python3 examples/consumer/sloth-consume.py tcp:127.0.0.1:8765
;
; Note the direction: `accept` is local, `connect` is the sensor. This
; file is the mirror image of sensor.conf — see the README.

; --- process -------------------------------------------------------
setuid  = stunnel4
setgid  = stunnel4
pid     = /run/stunnel/sloth-reader.pid
output  = /var/log/stunnel/sloth-reader.log

; --- service -------------------------------------------------------
[sloth-data]
; Plaintext side: LOOPBACK ONLY. Binding this to a routable address
; would re-expose in cleartext exactly what the tunnel exists to
; protect, one hop further along.
accept  = 127.0.0.1:8765

; TLS side: the sensor's stunnel listener (sensor.conf `accept`).
connect = sensor.example.com:8766

; This end is the TLS client.
client  = yes

; Our client certificate — the sensor's `verify = 2` requires it.
; Generate with:
;   openssl req -x509 -newkey rsa:4096 -days 825 -nodes \
;       -keyout reader-key.pem -out reader-cert.pem \
;       -subj "/CN=sloth-reader-01"
cert    = /etc/stunnel/certs/reader-cert.pem
key     = /etc/stunnel/certs/reader-key.pem

; --- server authentication (do not skip) ---------------------------
; Verify the sensor is the sensor. Without this the client trusts
; whatever answers on that name and a redirect harvests the stream.
verify  = 2
CAfile  = /etc/stunnel/certs/sensor-ca.pem

; Pin the expected name as well as the chain.
checkHost = sloth-sensor-01

sslVersion         = TLSv1.3
options            = NO_SSLv2
options            = NO_SSLv3
options            = NO_TLSv1
options            = NO_TLSv1.1
options            = NO_TLSv1.2
renegotiation      = no
