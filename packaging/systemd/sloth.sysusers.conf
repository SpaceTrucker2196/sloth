# `make install-service` as /usr/lib/sysusers.d/sloth.conf; the account
# is created by `systemd-sysusers`, never by make — the Makefile has no
# business running useradd.
#
# Type Name  ID  GECOS                   Home            Shell
u      sloth -   "sloth passive sensor"  /var/lib/sloth  /usr/sbin/nologin
