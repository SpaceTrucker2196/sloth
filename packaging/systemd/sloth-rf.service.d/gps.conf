# sloth-rf.service.d/gps.conf — device or network access for sloth-rf.
#
# Opt-in, never installed active by make. `sudo make install-service`
# places this file at /usr/local/share/sloth/sloth-rf-gps.conf; the
# operator edits it, uncommenting ONE of the two blocks below, and
# copies it to /etc/systemd/system/sloth-rf.service.d/gps.conf
# (docs/wiki/deployment.md §10.3). --location needs nothing here: a
# fixed position is a number on the command line. Neither do --adsb,
# --aprs and --rtl433 given a file: the unit already admits the
# conventional directories read-only.
#
# Why a drop-in and not the shipped unit: the unit allows AF_UNIX and
# nothing else, and no device. Each block widens it, and a daemon that
# only tails files should have neither an IP socket family nor a serial
# device.
#
# ── gpsd over TCP: --gps gpsd:// (127.0.0.1:2947 by default) ────────────
# The one to use on a host that also runs the Wi-Fi sensor with --gps:
# both daemons read GNSS (ADR 0010), a serial device opens once, and
# gpsd is what lets two readers share one receiver. gpsd has no
# Unix-socket data transport, so reading it needs AF_INET (AF_INET6 for
# gpsd://[::1]). RestrictAddressFamilies= allow-lists given more than
# once are merged, so this adds to the unit's AF_UNIX. The unit sets no
# IPAddressDeny=, so no IPAddressAllow= is needed; sloth-rf refuses a
# non-loopback gpsd without --gps-allow-remote, and --strict refuses one
# regardless. It sends gpsd one line, the ?WATCH request.
# The same block serves --adsb sbs:// and beast:// (a local readsb's SBS
# or Beast output, loopback only, read-only: sloth-rf sends nothing on
# that socket), which need the families for the same reason.
#
# Uncomment the WHOLE block below, this [Service] line included: a
# directive alone sits outside any section and systemd ignores it.
#[Service]
#RestrictAddressFamilies=AF_INET AF_INET6
#
# ── Serial NMEA receiver: --gps /dev/ttyACM0 (or /dev/ttyUSB0) ──────────
# Only where sloth-rf is the receiver's ONE reader: a host without the
# Wi-Fi sensor, or one whose sensor runs without --gps. The unit's
# PrivateDevices=true gives the service a private /dev holding only the
# pseudo-devices, so the node does not exist inside it and DeviceAllow=
# alone cannot help. PrivateDevices=false brings the host's /dev back;
# DevicePolicy=closed then keeps the cgroup device allow-list to the
# pseudo-devices plus exactly the receiver, read only (it is opened
# O_RDONLY and never written). The unit runs as User=sloth, so the open
# needs the device's group: SupplementaryGroups=dialout (Debian, Kali,
# Ubuntu; check `ls -l /dev/ttyACM0`).
#
# Whole block, [Service] line included (see above).
#[Service]
#PrivateDevices=false
#DevicePolicy=closed
#DeviceAllow=/dev/ttyACM0 r
#SupplementaryGroups=dialout
