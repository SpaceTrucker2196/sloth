# systemd-sysusers fragment for sloth-sdrsweep. Installed by
# `make install-service` as /usr/lib/sysusers.d/sloth-sdrsweep.conf; the
# account is created by `systemd-sysusers`, never by make. Its own
# account, not sloth's: the sweep helper writes /var/lib/sloth-sdrsweep
# and has no reason to reach the sensor's /var/lib/sloth
# (packaging/systemd/sloth-sdrsweep.service says why not DynamicUser=).
#
# Type Name           ID  GECOS                     Home                     Shell
u      sloth-sdrsweep -   "sloth SDR sweep helper"  /var/lib/sloth-sdrsweep  /usr/sbin/nologin
