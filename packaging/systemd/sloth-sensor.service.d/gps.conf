# sloth-sensor.service.d/gps.conf — device or network access for --gps.
#
# Opt-in, never installed active by make. `sudo make install-service`
# places this file at /usr/local/share/sloth/sloth-sensor-gps.conf; the
# operator edits it, uncommenting ONE of the two blocks below, copies it
# to /etc/systemd/system/sloth-sensor.service.d/gps.conf and adds --gps
# to SLOTH_ARGS (docs/wiki/deployment.md §7.2, docs/wiki/location.md).
# --location needs nothing here: a fixed position is a number on the
# command line. sloth-migrate-sensor does not write this file; a unit
# carrying --gps is refused by it and migrated by hand.
#
# Why a drop-in and not the shipped unit: the unit is the most locked
# down sloth runs, and each block widens it. A sensor without --gps
# should have neither a serial device nor an IP socket family.
#
# ── Serial NMEA receiver: --gps /dev/ttyACM0 (or /dev/ttyUSB0) ──────────
# The unit's PrivateDevices=true gives the service a private /dev holding
# only the pseudo-devices, so a ttyACM/ttyUSB node does not exist inside
# it at all and DeviceAllow= alone cannot help. PrivateDevices=false
# brings the host's /dev back; DevicePolicy=closed then keeps the cgroup
# device allow-list to the pseudo-devices plus exactly the receiver, read
# only (sloth opens it O_RDONLY and never writes a byte to it). The unit
# runs as User=sloth from the start, so the open needs the device's
# group: SupplementaryGroups=dialout (Debian, Kali, Ubuntu; check
# `ls -l /dev/ttyACM0`). sloth's own privilege drop does not run a uid
# change under this unit, so the group stays for the run.
#
# Uncomment the WHOLE block below, this [Service] line included: a
# directive alone sits outside any section and systemd ignores it.
#[Service]
#PrivateDevices=false
#DevicePolicy=closed
#DeviceAllow=/dev/ttyACM0 r
#SupplementaryGroups=dialout
#
# ── gpsd over TCP: --gps gpsd:// (127.0.0.1:2947 by default) ────────────
# gpsd has no Unix-socket data transport (gpsd(8): -F is a device
# add/remove control socket), so reading it needs AF_INET (AF_INET6 for
# gpsd://[::1]). RestrictAddressFamilies= allow-lists given more than
# once are merged, so this adds to the unit's AF_UNIX AF_NETLINK
# AF_PACKET (measured for bt-monitor.conf on systemd 262). The unit sets
# no IPAddressDeny=, so no IPAddressAllow= is needed; sloth itself
# refuses a non-loopback gpsd without --gps-allow-remote, and --strict
# refuses one regardless. sloth sends gpsd one line, the ?WATCH request.
#
# Whole block, [Service] line included (see above).
#[Service]
#RestrictAddressFamilies=AF_INET AF_INET6
