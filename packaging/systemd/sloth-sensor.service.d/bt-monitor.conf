# sloth-sensor.service.d/bt-monitor.conf — AF_BLUETOOTH for --bt-monitor.
#
# Opt-in, never installed active by make. `sudo make install-service`
# places this file at /usr/local/share/sloth/sloth-sensor-bt-monitor.conf;
# the operator copies it to
# /etc/systemd/system/sloth-sensor.service.d/bt-monitor.conf when, and
# only when, SLOTH_ARGS carries --bt-monitor (docs/wiki/deployment.md
# §7.1). sloth-migrate-sensor writes it there itself when the unit it
# migrates has the flag.
#
# libpcap's bluetooth-monitor device is an AF_BLUETOOTH socket bound to
# the HCI monitor channel, refused with EAFNOSUPPORT without this
# (measured 2026-10-26). The bind is receive-only and the kernel checks
# CAP_NET_RAW for it, which sloth holds until the #140 drop.
#
# Why a drop-in and not the shipped list: the family is not only what
# sloth's code does with it, but what code running inside a compromised
# sensor could. With AF_BLUETOOTH allowed, a uid with no capabilities
# can still bind a raw HCI socket and send what the kernel's
# hci_sec_filter admits — Inquiry and Remote Name Request among them —
# or connect() an L2CAP socket, and either puts frames on the air
# whenever an hciN is up under the kernel stack. The sensor parses
# hostile traffic, so a sensor without --bt-monitor should not have the
# family at all (MISSION.md §2, defence in depth).
#
# RestrictAddressFamilies= allow-lists given more than once are merged,
# so this adds AF_BLUETOOTH to the unit's AF_UNIX AF_NETLINK AF_PACKET
# (measured on systemd 262, 2026-10-26, with a user unit allowing
# AF_UNIX and a drop-in allowing AF_INET: socket(AF_INET) succeeded with
# the drop-in and failed EAFNOSUPPORT without it).
[Service]
RestrictAddressFamilies=AF_BLUETOOTH
