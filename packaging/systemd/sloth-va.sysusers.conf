# systemd-sysusers fragment for sloth-va. Installed by `make
# install-service` as /usr/lib/sysusers.d/sloth-va.conf; the account is
# created by `systemd-sysusers`, never by make. Its own account: the
# Victron reader writes /var/lib/sloth-va and has no reason to reach the
# sensor's /var/lib/sloth (packaging/systemd/sloth-va.service).
#
# Type Name     ID  GECOS                       Home               Shell
u      sloth-va -   "sloth Victron reader"      /var/lib/sloth-va  /usr/sbin/nologin
